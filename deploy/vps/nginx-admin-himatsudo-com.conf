# =============================================================================
# 統合CMSハブ用 nginx 設定（VPSリバースプロキシ + 自宅サーバsystemd方式）
#   配置先: /etc/nginx/sites-available/admin-himatsudo-com.conf
#   有効化: ln -s /etc/nginx/sites-available/admin-himatsudo-com.conf /etc/nginx/sites-enabled/
#
# Himatsudo / HimatsudoFortune 本体と同じ「自宅サーバでアプリ（ここでは
# `vite preview`）を動かし、VPSはTailscale経由でリバースプロキシするだけ」
# という構成を、CMSにも適用したもの。
#
#   /            → public/index.html（ハブ入口ページ、VPS上に直接配置した静的ファイル）
#   /himatsudo/  → 自宅サーバの himatsudocmshub-himatsudo.service (vite preview, 4174) へプロキシ
#   /fortune/    → 自宅サーバの himatsudocmshub-fortune.service (vite preview, 4175) へプロキシ
#
# ※ ハブ入口ページだけは単一の静的HTMLなのでVPS上に直置きし、自宅サーバへは
#   飛ばさない（`deploy/nginx-admin-himatsudo-com.conf`＝静的ファイル直配信方式
#   と同じやり方）。ビルドが必要な2つの管理画面だけを自宅サーバ側でホストする。
#
# 各アプリはブラウザから直接、それぞれのバックエンドドメイン
# （Himatsudo / HimatsudoFortune 自身のオリジン）へ JWT ベアラー認証で
# クロスオリジンAPIリクエストを行う（このnginx/vite previewはAPIのプロキシはしない）。
# 呼び出し先のCORS許可オリジンに https://admin.himatsudo.com を追加しておくこと
# （Himatsudo: public/index.php の CMS_HUB_ORIGIN、
#   HimatsudoFortune: .env の CORS_ALLOWED_ORIGINS）。
#
# 事前準備（自宅サーバ側）:
#   deploy/home/himatsudocmshub-himatsudo.service
#   deploy/home/himatsudocmshub-fortune.service
#   の手順に従って npm run build 済みの vite preview を常駐させておくこと。
#
# 置き換える箇所:
#   /var/www/himatsudocmshub → このリポジトリの「ハブ入口ページ用」配置先パス
#                              （public/index.html だけ置ければよい）
#   100.x.x.x                → 自宅サーバの Tailscale IP（`tailscale ip -4`）
#
# TLS 証明書は certbot（Let's Encrypt）で取得する想定。
# 先にこの 80 番だけの状態で `certbot --nginx -d admin.himatsudo.com` を実行すると、
# certbot が自動で 443 ブロックと証明書行を追記してくれる。
#
# 管理画面を無防備にインターネット公開することになるため、Basic 認証の
# 併用を強く推奨する（下記コメントアウト部分を参照）。
# =============================================================================

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    listen [::]:80;
    server_name admin.himatsudo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS（本体）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.himatsudo.com;

    # ── certbot 実行後に以下が自動追記される ──
    # ssl_certificate     /etc/letsencrypt/live/admin.himatsudo.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.himatsudo.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── (推奨) Basic 認証で管理画面全体を保護する ──
    # sudo apt install -y apache2-utils
    # sudo htpasswd -c /etc/nginx/.htpasswd <ユーザー名>
    # auth_basic           "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # ── 自宅サーバ（Tailscale 経由）へプロキシ ──
    location /himatsudo/ {
        proxy_pass http://100.x.x.x:4174;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /fortune/ {
        proxy_pass http://100.x.x.x:4175;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── ハブ入口ページはVPS上に直置きした静的ファイルをそのまま返す ──
    location = / {
        root /var/www/himatsudocmshub/public;
        try_files /index.html =404;
    }
}
