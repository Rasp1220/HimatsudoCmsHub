<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>統合CMSハブ | Himatsudo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p.lead {
      color: #94a3b8;
      margin: 0 0 40px;
      font-size: 0.95rem;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
    }
    a.card {
      display: block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.card:hover {
      border-color: #60a5fa;
      transform: translateY(-2px);
    }
    .card .icon {
      font-size: 2.25rem;
      margin-bottom: 12px;
    }
    .card .name {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card .desc {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>統合CMSハブ</h1>
    <p class="lead">管理する画面を選んでください</p>
    <div class="cards">
      <a class="card" id="link-himatsudo" href="/himatsudo/">
        <div class="icon">📝</div>
        <div class="name">Himatsudo CMS</div>
        <div class="desc">記事・カテゴリ・ユーザー管理</div>
      </a>
      <a class="card" id="link-fortune" href="/fortune/">
        <div class="icon">🔮</div>
        <div class="name">ひまつど占い CMS</div>
        <div class="desc">コラム・お知らせ・ユーザ管理</div>
      </a>
    </div>
    <footer>admin.himatsudo.com</footer>
  </div>
  <script>
    // ローカル開発では apps/himatsudo・apps/fortune がそれぞれ別ポートの
    // Vite dev server で動くため、このハブページ自身が localhost 上にいる場合は
    // 各アプリの dev server ポートへ直接リンクする。
    // 本番（同一オリジンにパスプレフィックスでデプロイ）では相対パスのままでよい。
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      document.getElementById('link-himatsudo').href = 'http://localhost:5174/himatsudo/';
      document.getElementById('link-fortune').href = 'http://localhost:5175/fortune/';
    }
  </script>
</body>
</html>
