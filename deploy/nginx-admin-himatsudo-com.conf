# =============================================================================
# 統合CMSハブ用 nginx 設定（サンプル）
#   配置先: /etc/nginx/sites-available/admin-himatsudo-com.conf
#   有効化: ln -s /etc/nginx/sites-available/admin-himatsudo-com.conf /etc/nginx/sites-enabled/
#
# admin.himatsudo.com 配下に、パスプレフィックスで2つの管理画面 + ハブ入口ページを配信する。
#   /            → public/index.html（どちらのCMSを開くか選ぶ入口ページ）
#   /himatsudo/  → apps/himatsudo のビルド成果物 (dist/)
#   /fortune/    → apps/fortune のビルド成果物 (dist/)
#
# 各アプリはブラウザから直接、それぞれのバックエンドドメイン
# （Himatsudo / HimatsudoFortune 自身のオリジン）へ JWT ベアラー認証で
# クロスオリジンAPIリクエストを行うため、このnginxではAPIのプロキシは行わない。
# 呼び出し先のCORS許可オリジンに https://admin.himatsudo.com を追加しておくこと
# （Himatsudo: public/index.php の CMS_HUB_ORIGIN、
#   HimatsudoFortune: .env の CORS_ALLOWED_ORIGINS）。
#
# 事前準備:
#   cd apps/himatsudo && npm run build
#   cd apps/fortune   && npm run build
#
# 置き換える箇所:
#   /var/www/himatsudocmshub → このリポジトリのデプロイ先パス
#
# TLS 証明書は certbot（Let's Encrypt）で取得する想定。
# 先にこの 80 番だけの状態で `certbot --nginx -d admin.himatsudo.com` を実行すると、
# certbot が自動で 443 ブロックと証明書行を追記してくれる。
#
# 管理画面を無防備にインターネット公開することになるため、Basic 認証の
# 併用を強く推奨する（下記コメントアウト部分を参照）。
# =============================================================================

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    listen [::]:80;
    server_name admin.himatsudo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS（本体）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.himatsudo.com;

    # ── certbot 実行後に以下が自動追記される ──
    # ssl_certificate     /etc/letsencrypt/live/admin.himatsudo.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.himatsudo.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── (推奨) Basic 認証で管理画面全体を保護する ──
    # sudo apt install -y apache2-utils
    # sudo htpasswd -c /etc/nginx/.htpasswd <ユーザー名>
    # auth_basic           "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    root /var/www/himatsudocmshub;

    location /himatsudo/ {
        alias /var/www/himatsudocmshub/apps/himatsudo/dist/;
        try_files $uri $uri/ /himatsudo/index.html;
    }

    location /fortune/ {
        alias /var/www/himatsudocmshub/apps/fortune/dist/;
        try_files $uri $uri/ /fortune/index.html;
    }

    location = / {
        root /var/www/himatsudocmshub/public;
        try_files /index.html =404;
    }
}
